name: Daily Pipeline

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'   # executa diariamente
  workflow_dispatch:      # permite executar manualmente

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_CONTAINER_BRONZE: ${{ secrets.AZURE_CONTAINER_BRONZE }}
  AZURE_DATABRICKS_HOST: ${{ secrets.AZURE_DATABRICKS_HOST }}
  AZURE_DATABRICKS_TOKEN: ${{ secrets.AZURE_DATABRICKS_TOKEN }}
  AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}  
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
  AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
  AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT }}
  EVENTHUB_NAMESPACE: ${{ secrets.EVENTHUB_NAMESPACE }}
  DATABRICKS_WORKSPACE: ${{ secrets.DATABRICKS_WORKSPACE }}
  LOG_ANALYTICS_WORKSPACE: ${{ secrets.LOG_ANALYTICS_WORKSPACE }}

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar notebook
        run: |
          pip install nbconvert jupyter
          jupyter nbconvert \
            --to notebook \
            --execute jobs/main.ipynb \
            --output executed.ipynb

            run: echo "${{ secrets.AZURE_CLIENT_ID != '' }}"